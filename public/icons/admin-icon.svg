<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E9DA" />
      <stop offset="50%" stop-color="#DCC9A6" />
      <stop offset="100%" stop-color="#B67355" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1F1F" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#333333" stroke-width="4" />

  <!-- Inner Gold Trim Border -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- ARMIA Monogram & Silhouette Group -->
  <g transform="translate(156, 75) scale(2.0)">
    <!-- Stylized "A" Monogram -->
    <path
      d="M 50 15 L 20 85 L 32 85 L 42 62 L 58 62 L 68 85 L 80 85 Z"
      fill="url(#goldGrad)"
      filter="url(#glow)"
    />
    <!-- Silhouette Profile with Hat and Flowing Hair -->
    <path
      d="M 50 25 C 45 28, 42 34, 42 42 C 42 50, 48 55, 52 58 C 55 60, 56 65, 54 70 C 52 75, 46 80, 40 85 C 50 82, 58 76, 62 68 C 65 62, 64 54, 60 48 C 56 42, 56 35, 58 30 Z"
      fill="url(#goldGrad)"
      opacity="0.9"
    />
    <!-- Wide Brim Fedora / Sunhat silhouette -->
    <ellipse cx="50" cy="32" rx="22" ry="5" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography: ARMIA -->
  <text
    x="256"
    y="335"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, serif"
    font-size="44"
    font-weight="800"
    letter-spacing="10"
    fill="url(#goldGrad)"
  >
    ARMIA
  </text>

  <!-- Subtitle: BOUTIQUE -->
  <text
    x="256"
    y="368"
    text-anchor="middle"
    font-family="'Montserrat', sans-serif"
    font-size="14"
    font-weight="600"
    letter-spacing="8"
    fill="#DCC9A6"
    opacity="0.8"
  >
    BOUTIQUE
  </text>

  <!-- Gold Divider -->
  <line x1="170" y1="390" x2="342" y2="390" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Distinctive "ADMIN" Badge Pill -->
  <g transform="translate(166, 410)">
    <rect width="180" height="42" rx="21" fill="#000000" stroke="url(#goldGrad)" stroke-width="2" />
    <text
      x="90"
      y="27"
      text-anchor="middle"
      font-family="'Montserrat', sans-serif"
      font-size="16"
      font-weight="900"
      letter-spacing="6"
      fill="url(#goldGrad)"
    >
      ADMIN
    </text>
  </g>
</svg>
